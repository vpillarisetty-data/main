# Workspace configuration only. Each project under projects/ is its own installable package
# (see projects/<name>/pyproject.toml); `make install` installs them all in editable mode.

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["projects", "scenarios"]
pythonpath = [
  ".",
  "projects/medallion-framework/src",
  "projects/streaming-exactly-once/src",
  "projects/data-contracts/src",
  "projects/delta-table-doctor/src",
  "projects/pii-guardian/src",
  "projects/catalog-agent/src",
  "projects/migration-validator/src",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["medallion", "streamguard", "contractkit", "deltadoctor", "piiguard", "catalog_agent", "migrationkit", "scenarios"]

[tool.ruff.lint.per-file-ignores]
"projects/*/deploy/*.py" = ["I001"]
"projects/*/local/*.py" = ["I001"]
