name: ci
on:
  push:
  pull_request:

jobs:
  unit:
    name: unit + lint (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml pytest ruff
      - run: ruff check projects conftest.py
      - run: python -m pytest   # Spark tests auto-skip here

  spark-integration:
    name: Spark + Delta integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "pyspark==3.5.3" "delta-spark==3.2.1" pyarrow pyyaml pytest
      - run: python -m pytest -rs

  install-smoke:
    name: clean install of every package + CLIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ./projects/*
      - name: run every CLI from outside the repo
        working-directory: /tmp
        run: |
          python -c "import medallion, streamguard, contractkit, deltadoctor, piiguard, catalog_agent, migrationkit"
          medallion-run $GITHUB_WORKSPACE/projects/medallion-framework/conf/pipelines/card_transactions.yaml --validate-only
          contractkit ddl $GITHUB_WORKSPACE/projects/data-contracts/contracts/customer_rewards.v1.yaml
          piiguard $GITHUB_WORKSPACE/projects/pii-guardian/examples/customer_sample.jsonl --table a.b.c > /dev/null
          migrationkit convert-ddl --from oracle $GITHUB_WORKSPACE/projects/migration-validator/examples/oracle_schema.sql
          migrationkit demo > /dev/null
          catalog-agent-demo
          deltadoctor --help

  agent-evals:
    name: GenAI guardrail evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: pip install ./projects/catalog-agent && catalog-agent-evals
