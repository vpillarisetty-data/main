[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-medallion"
version = "1.0.0"
description = "Config-driven Bronze/Silver/Gold framework for Delta Lake with sequence-guarded MERGE and SCD2."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
spark = ["pyspark>=3.5", "delta-spark>=3.2"]

[project.scripts]
medallion-run = "medallion.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
