[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-migrationkit"
version = "1.0.0"
description = "Legacy-to-lakehouse migration toolkit: type mapping with risk analysis and hash-bucket reconciliation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
spark = ["pyspark>=3.5"]

[project.scripts]
migrationkit = "migrationkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
