[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-piiguard"
version = "1.0.0"
description = "Validated PII discovery and Unity Catalog masking policy-as-code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
piiguard = "piiguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
