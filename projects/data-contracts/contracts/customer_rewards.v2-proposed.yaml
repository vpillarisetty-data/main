# A realistic "small" PR that silently breaks three downstream teams.
id: rewards.customer_points
version: 1.5.0
owner: rewards-data-products
dataset: rewards.gold.customer_points
description: Daily rewards points balance per customer account.
sla:
  freshness_minutes: 240
  completeness_pct: 99.9
schema:
  - {name: account_id,   type: string, nullable: false, unique: true, description: Tokenized account id}
  - {name: tier,         type: string, nullable: false, enum: [green, gold, platinum, centurion]}
  - {name: points,       type: bigint, nullable: false}
  - {name: points_value, type: "decimal(14,2)", description: USD value of points}
  - {name: as_of_date,   type: date,   nullable: true}
  - {name: expiring_points, type: int}
